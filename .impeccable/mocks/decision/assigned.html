<!doctype html><html><head><meta charset="utf-8"><title>Paint Chip Rack</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#fff;font-family:Archivo,sans-serif;color:#1a1a1a;overflow:hidden}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 56px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.logo{font-size:26px;font-weight:900;font-stretch:125%;letter-spacing:-.01em;text-transform:none}
.wrap{display:grid;grid-template-columns:520px 1fr;gap:40px;padding:24px 56px}
h1{font-size:88px;line-height:.92;font-weight:900;font-stretch:72%;letter-spacing:-.02em;text-transform:uppercase}
.sub{margin-top:24px;font-size:20px;max-width:420px;color:#444}
.tab{margin-top:40px;display:inline-flex;align-items:center;gap:14px;background:#1a1a1a;color:#fff;padding:22px 30px 22px 22px;font-size:22px;font-weight:700;border-radius:4px}
.tab i{width:22px;height:22px;border-radius:50%;background:#fff;display:block}
.rack{display:flex;gap:14px;align-items:flex-end;transform:rotate(-4deg);margin-top:-10px}
.strip{width:118px;background:#fff;border:1px solid #ddd;box-shadow:0 18px 30px -18px rgba(0,0,0,.35);padding:8px 8px 14px;border-radius:3px}
.strip:nth-child(odd){transform:translateY(-40px)}
.chip{height:96px;margin-bottom:6px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;font-weight:700;line-height:1.1}
.code{font-size:10px;letter-spacing:.1em;opacity:.7}
.fam{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:6px 2px}
.out{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px)}
</style></head><body>
<nav><span class="logo">LendLoop</span><span>How it works · Categories · Sign in</span></nav>
<div class="wrap"><div><h1>Borrow what you need. Lend what you don't.</h1><p class="sub">Tools from your street, named and on the rack. Pick one, pick your days, pick it up.</p><span class="tab"><i></i>Sign in to borrow</span></div>
<div class="rack">
<script>
const fams=[["Power tools",["#7a2e05","#c2410c","#e8590c","#ff922b","#ffc078"],["Cordless drill","Jigsaw","Orbital sander","Circular saw","Impact driver"]],
["Garden",["#14532d","#2b8a3e","#40c057","#8ce99a","#d3f9d8"],["Hedge trimmer","Leaf blower","Loppers","Wheelbarrow","Lawn rake"]],
["Camping",["#0b2e59","#1864ab","#339af0","#74c0fc","#d0ebff"],["4-person tent","Camp stove","Cool box","Lantern","Sleeping mat"]],
["Kitchen",["#6b0f2b","#c2255c","#f06595","#faa2c1","#ffdeeb"],["Stand mixer","Pasta machine","Slow cooker","Ice-cream maker","Fondue set"]],
["Hand tools",["#5c3d00","#b07d00","#e0a100","#ffd43b","#fff3bf"],["Socket set","Spirit level","Stud finder","Clamps","Tile cutter"]],
["Cleaning",["#063b3b","#0c8599","#22b8cf","#66d9e8","#c5f6fa"],["Pressure washer","Carpet cleaner","Window vac","Steam mop","Gutter scoop"]],
["Other",["#2b1a5c","#5f3dc4","#845ef7","#b197fc","#e5dbff"],["Ladder 3m","Sack truck","Projector","Gazebo","Folding tables"]]];
document.write(fams.map(([f,c,t])=>`<div class="strip"><div class="fam">${f}</div>${c.map((col,i)=>`<div class="chip ${i==1?'out':''}" style="background:${col};color:${i<3?'#fff':'#1a1a1a'}"><span class="code">LL-${(i+1)*137%900}</span>${t[i]}</div>`).join('')}</div>`).join(''));
</script></div></div></body></html>
